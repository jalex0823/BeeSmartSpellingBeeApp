<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFD700">
    <title>{% block title %}BeeSmart Spelling App{% endblock %}</title>
    
    <!-- Favicon for all platforms -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/static/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/android-chrome-512x512.png">
        <!-- PWA Manifest -->
        <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
        <script>
            // Register service worker if supported
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    const swUrl = '/static/service-worker.js?v={{ timestamp }}';
                    navigator.serviceWorker.register(swUrl).then((reg) => {
                        try {
                            if (reg && typeof reg.update === 'function') reg.update();
                        } catch (e) { /* no-op */ }
                        try {
                            if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                        } catch (e) { /* no-op */ }
                        try {
                            let reloaded = false;
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                if (reloaded) return;
                                reloaded = true;
                                window.location.reload();
                            });
                        } catch (e) { /* no-op */ }
                    }).catch(() => {});
                });
            }
        </script>

        <script>
            // Optional accessibility/performance: disable ALL animations via localStorage.
            (function () {
                try {
                    const KEY_ANIM = 'beesmart_disable_animations_v1';
                    const storedAnim = localStorage.getItem(KEY_ANIM);
                    if (storedAnim === '1') {
                        document.documentElement.classList.add('beesmart-no-motion');
                        window.__beesmartDisableAnimations = true;
                    }
                } catch (e) {
                    // no-op
                }
            })();
        </script>

        <script>
            // Hard-disable sweep/shimmer overlays globally (future-proof for mobile).
            // This targets the translucent gradient sweeps that can appear over content.
            (function () {
                window.__beesmartDisableSweepOverlays = true;
                try {
                    document.documentElement.classList.add('beesmart-no-sweep-overlays');
                } catch (e) {
                    // no-op
                }
            })();
        </script>

        <script>
            // Performance hard-stop (default): disable background FX layers that can create
            // large translucent paints and hurt scrolling/tap hit-testing on mobile.
            //
            // Debug bypass: add ?fx=on to enable for troubleshooting.
            (function () {
                try {
                    const params = new URLSearchParams(window.location.search || '');
                    const fxOn = (params.get('fx') || '').toLowerCase() === 'on';
                    if (fxOn) return;

                    window.__beesmartDisableBackgroundAnimations = true;
                    document.documentElement.classList.add('beesmart-no-bg-anim');
                } catch (e) {
                    // no-op
                }
            })();
            </script>

        <!-- Emergency overlay disable: force-hide known overlay classes that
             can create large translucent repaints and block hit-testing on mobile.
             This is intentionally high-specificity and uses !important so it
             takes effect early during page load. Keep minimal and reversible.
        -->
        <style id="beesmart-disable-overlays">
            /* Known overlay selectors used across templates */
            .loading-overlay,
            .bee-modal-overlay,
            .honey-home-overlay,
            #avatar-loading-overlay,
            .background-overlay,
            .sweep-overlay,
            .diagonal-overlay,
            .overlay-fx,
            .transparent-overlay {
                display: none !important;
                opacity: 0 !important;
                pointer-events: none !important;
                will-change: auto !important;
            }

            /* Ensure mascot/avatar canvas remains interactive and not blocked */
            #mascotBee3D, #mascotBee3D canvas, .avatar-canvas {
                pointer-events: auto !important;
            }

            /* Increase minimum tap target size for mobile touch targets */
            .touch-target, .btn, button, .menu-item, .tile {
                min-width: 44px !important;
                min-height: 44px !important;
                touch-action: manipulation !important;
            }
        </style>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/BeeSmart.css') }}?v={{ timestamp }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-fixes.css') }}?v={{ timestamp }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-fonts.css') }}?v={{ timestamp }}">

    <!-- Centralized Logo Configuration - CHANGE LOGO HERE -->
    <script src="{{ url_for('static', filename='js/logo-config.js') }}?v={{ timestamp }}"></script>
    
    <!-- Modern CSS Framework -->
    <style>
        /* CSS Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #FF69B4;
            --secondary-color: #fbc2eb;

        /* Bee friends buzzing across the background */
        .bee-swarm {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 45;
            overflow: hidden;
        }

        .bee {
            position: absolute;
            width: 26px;
            height: 18px;
            background: linear-gradient(90deg, #FFD166 0%, #FFD166 33%, #F49725 33%, #F49725 66%, #FFD166 66%, #FFD166 100%);
            border-radius: 13px 13px 10px 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
            transform-origin: center;
            --bee-x: 0px;
            --bee-y: 0px;
            --bee-rotation: 0deg;
            --bee-scale: 1;
            --bee-bob: 0px;
            transform: translate3d(var(--bee-x), calc(var(--bee-y) + var(--bee-bob)), 0) rotate(var(--bee-rotation)) scale(var(--bee-scale));
            animation: beeBuzz 1.6s ease-in-out infinite;
            will-change: transform;
        }

        .bee::before,
        .bee::after {
            content: '';
            position: absolute;
            top: -7px;
            width: 18px;
            height: 14px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 4px 12px rgba(173, 216, 230, 0.4);
            animation: wingFlap 1.2s ease-in-out infinite;
        }

        .bee::before {
            left: -4px;
        }

        .bee::after {
            right: -4px;
            animation-delay: 0.2s;
        }

        .bee span {
            position: absolute;
            right: -6px;
            top: 7px;
            width: 0;
            height: 0;
            border-left: 6px solid #F49725;
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            transform: rotate(15deg);
        }

        @keyframes beeBuzz {
            0%, 100% {
                --bee-bob: 0px;
                --bee-scale: 1;
            }
            50% {
                --bee-bob: -3px;
                --bee-scale: 1.05;
            }
        }

        @keyframes wingFlap {
            0%, 100% {
                transform: rotate(-15deg) scale(1);
                opacity: 0.9;
            }
            50% {
                transform: rotate(15deg) scale(1.15);
                opacity: 1;
            }
        }

            --accent-color: #FF1493;
            --bg-primary: linear-gradient(135deg, #FFF4E6 0%, #FFEAC2 50%, #FFE4CC 100%);
            --bg-secondary: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(255, 105, 180, 0.2);
            --shadow-hover: 0 12px 40px rgba(255, 105, 180, 0.3);
            --border-radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (prefers-reduced-motion: reduce) {
            :root {
                --transition: none;
            }
        }

        :root.beesmart-no-motion {
            --transition: none;
        }

        html.beesmart-no-motion {
            scroll-behavior: auto;
        }

        html.beesmart-no-motion *,
        html.beesmart-no-motion *::before,
        html.beesmart-no-motion *::after {
            animation: none !important;
            transition: none !important;
        }

        /* Remove fixed shimmer/texture overlays that can wash out UI and hurt scroll performance */
        html.beesmart-no-motion body::before,
        html.beesmart-no-motion body::after {
            content: none !important;
            display: none !important;
            animation: none !important;
            background: none !important;
        }

        /* Also hide decorative layers entirely in no-motion mode */
        html.beesmart-no-motion .fairy-container,
        html.beesmart-no-motion .bee-swarm {
            display: none !important;
        }

        /* Also hide decorative layers when background animations are disabled */
        html.beesmart-no-bg-anim .fairy-container,
        html.beesmart-no-bg-anim .bee-swarm {
            display: none !important;
        }

        html.beesmart-no-motion button,
        html.beesmart-no-motion [role="button"],
        html.beesmart-no-motion .menu-option,
        html.beesmart-no-motion .action-btn,
        html.beesmart-no-motion .btn,
        html.beesmart-no-motion .btn-action,
        html.beesmart-no-motion .btn-primary,
        html.beesmart-no-motion .btn-secondary,
        html.beesmart-no-motion .btn-danger,
        html.beesmart-no-motion .btn-guest,
        html.beesmart-no-motion .btn-back,
        html.beesmart-no-motion .btn-back-to-menu,
        html.beesmart-no-motion .back-link,
        html.beesmart-no-motion .back-btn,
        html.beesmart-no-motion .nav-btn,
        html.beesmart-no-motion .view-btn,
        html.beesmart-no-motion .register-button {
            transform: none !important;
        }

        /* Mobile UX: ensure back/navigation controls have a minimum 44x44 tap target */
        .back-button,
        .btn-back,
        .btn-back-to-menu,
        .btn-back-menu,
        .back-link,
        .back-btn,
        .back-home-btn,
        .back-menu-btn {
            min-width: 44px;
            min-height: 44px;
        }

        /* Mobile UX: fixed back button should be reachable on iPhone notch devices */
        .beesmart-fixed-back {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            z-index: 10001;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Mobile UX: alternative fixed back placement (bottom-left) for easier thumb reach.
           Default to bottom-left on small screens; keep top-left on larger screens. */
        .beesmart-fixed-back-bottom-left {
            position: fixed;
            left: max(12px, env(safe-area-inset-left));
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 10001;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        @media (min-width: 769px) {
            .beesmart-fixed-back-bottom-left {
                top: max(12px, env(safe-area-inset-top));
                bottom: auto;
            }
        }

        /* Slightly larger padding on narrow screens while keeping the 44x44 minimum */
        @media (max-width: 768px) {
            .beesmart-fixed-back {
                top: max(10px, env(safe-area-inset-top));
                left: max(10px, env(safe-area-inset-left));
            }

            .beesmart-fixed-back-bottom-left {
                left: max(10px, env(safe-area-inset-left));
                bottom: max(14px, env(safe-area-inset-bottom));
            }
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        

        
        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Fairy Animation Container */
        .fairy-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }
        
        .fairy {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, var(--primary-color), transparent);
            border-radius: 50%;
            opacity: 0.8;
            animation: fairyFloat 15s linear infinite;
        }
        
        .fairy::before {
            content: '✨';
            position: absolute;
            top: -5px;
            left: -5px;
            font-size: 12px;
            animation: sparkle 2s ease-in-out infinite;
        }
        
        @keyframes fairyFloat {
            0% {
                transform: translateX(-50px) translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateX(calc(100vw + 50px)) translateY(-50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
        }
        
        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .fairy {
                animation: none;
                opacity: 0.3;
            }
            .fairy::before {
                animation: none;
            }
            .bee {
                animation: none;
                opacity: 0.25;
            }
            .bee::before,
            .bee::after {
                animation: none;
            }
        }
        
        /* Utility Classes */
        .text-center { text-align: center; }
        .mb-1 { margin-bottom: 1rem; }
        .mb-2 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 2rem; }
        .hidden { display: none; }
        
        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background: linear-gradient(135deg, #FFF3C4 0%, #FFE4F4 100%);
            color: #5A2C15;
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 14px 26px rgba(255, 193, 204, 0.4);
            margin-bottom: 1rem;
            border-left: 6px solid #FF9AA2;
            transform: translateX(100%);
            transition: var(--transition);
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.error {
            background: linear-gradient(135deg, #FFB4A2 0%, #FF8B94 100%);
            color: #4A1F1F;
            border-left-color: #FF6F91;
        }

        .toast.success {
            background: linear-gradient(135deg, #C8F7C5 0%, #96E6B3 100%);
            color: #1B5E20;
            border-left-color: #66BB6A;
        }
        /* Unified Avatar Stage (shared across login/register/dashboards) */
        .unified-avatar-stage {
            width: 100%;
            max-width: 800px;
            height: 360px;
            margin: 0.75rem auto 1rem auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible; /* let avatar glow/effects escape */
        }
        .unified-avatar-stage.large { height: 480px; }
        .unified-avatar-stage .avatar-fallback { font-size: 4rem; text-align: center; }
        @media (max-width: 600px) {
            .unified-avatar-stage { height: 300px; margin: 0.5rem auto 0.75rem auto; }
            .unified-avatar-stage.large { height: 380px; }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .header-content {
                padding: 0 1rem;
            }
            
            .logo h1 {
                font-size: 1.25rem;
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Fairy Animation Container -->
    <div class="fairy-container" id="fairyContainer" aria-hidden="true"></div>
    <div class="bee-swarm" id="beeSwarm" aria-hidden="true"></div>

    <!-- Global Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" role="dialog" aria-modal="true" aria-label="Loading checks" data-brand-loaded="false" style="display: none;">
    <img src="{{ url_for('static', filename='BeeSmartCrestLogo1.png') }}" alt="BeeSmart Crest Logo" class="crest-logo brand-logo" decoding="async" />
        <div class="checks" id="loadingChecks" aria-live="polite" style="display: none;">
            <!-- Loading check items -->
        </div>
        <button id="loadingStartBtn" class="pulse-btn" disabled aria-disabled="true" aria-label="Tap to start once ready" style="display: none;">Tap to Start</button>
        <button class="skip-link" type="button" onclick="window.LoadingScreenManager && window.LoadingScreenManager.hide()" style="display: none;">Skip</button>
    </div>
    
    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Base JavaScript -->
    <script>
        // Fairy Animation System
        class FairyAnimation {
            constructor() {
                this.container = document.getElementById('fairyContainer');
                this.fairies = [];
                this.isReducedMotion =
                    (window.__beesmartDisableAnimations === true) ||
                    (window.__beesmartDisableBackgroundAnimations === true) ||
                    document.documentElement.classList.contains('beesmart-no-motion') ||
                    document.documentElement.classList.contains('beesmart-no-bg-anim') ||
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                
                if (!this.isReducedMotion) {
                    this.startAnimation();
                }
            }
            
            createFairy() {
                const fairy = document.createElement('div');
                fairy.className = 'fairy';
                fairy.style.left = Math.random() * -100 + 'px';
                fairy.style.top = Math.random() * window.innerHeight + 'px';
                
                this.container.appendChild(fairy);
                this.fairies.push(fairy);
                
                // Remove fairy after animation
                setTimeout(() => {
                    if (fairy.parentNode) {
                        fairy.parentNode.removeChild(fairy);
                    }
                    this.fairies = this.fairies.filter(f => f !== fairy);
                }, 15000);
            }
            
            startAnimation() {
                // Create initial fairy
                this.createFairy();
                
                // Create new fairy every 3-8 seconds
                setInterval(() => {
                    if (this.fairies.length < 3) { // Limit concurrent fairies
                        this.createFairy();
                    }
                }, Math.random() * 5000 + 3000);
            }
        }
        
        class BeeAnimation {
            constructor() {
                this.container = document.getElementById('beeSwarm');
                this.bees = [];
                this.animationId = null;
                this.lastTimestamp = null;
                this.honeycombCenters = [
                    { x: 0.32, y: 0.32 },
                    { x: 0.5, y: 0.22 },
                    { x: 0.68, y: 0.32 },
                    { x: 0.38, y: 0.57 },
                    { x: 0.56, y: 0.68 },
                    { x: 0.74, y: 0.57 }
                ];
                this.isReducedMotion =
                    (window.__beesmartDisableAnimations === true) ||
                    (window.__beesmartDisableBackgroundAnimations === true) ||
                    document.documentElement.classList.contains('beesmart-no-motion') ||
                    document.documentElement.classList.contains('beesmart-no-bg-anim') ||
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                if (!this.isReducedMotion && this.container) {
                    this.populate();
                    this.animate = this.animate.bind(this);
                    this.animationId = requestAnimationFrame(this.animate);
                    window.addEventListener('resize', () => this.updateBeeTransforms());
                }
            }

            populate() {
                const count = window.innerWidth > 1024 ? 6 : 4;
                for (let i = 0; i < count; i++) {
                    this.createBee(i);
                }
                this.updateBeeTransforms();
            }

            createBee(index) {
                const element = document.createElement('div');
                element.className = 'bee';
                element.innerHTML = '<span></span>';
                this.container.appendChild(element);

                const center = this.honeycombCenters[index % this.honeycombCenters.length] || { x: 0.5, y: 0.5 };

                const bee = {
                    element,
                    center,
                    angle: Math.random() * Math.PI * 2,
                    speed: (0.35 + Math.random() * 0.25) * (Math.random() < 0.5 ? 1 : -1),
                    radius: 0.12 + Math.random() * 0.05,
                    eccentricity: 0.75 + Math.random() * 0.15,
                    wobblePhase: Math.random() * Math.PI * 2,
                    wobbleAmplitude: 4 + Math.random() * 3
                };

                this.bees.push(bee);
            }

            updateBeeTransforms() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const minDimension = Math.min(width, height);

                this.bees.forEach((bee) => {
                    const radiusPx = bee.radius * minDimension;
                    const x = bee.center.x * width + Math.cos(bee.angle) * radiusPx;
                    const y = bee.center.y * height + Math.sin(bee.angle) * radiusPx * bee.eccentricity;

                    bee.element.style.setProperty('--bee-x', `${x - 13}px`);
                    bee.element.style.setProperty('--bee-y', `${y - 9}px`);
                    bee.element.style.setProperty('--bee-rotation', `${(bee.angle * 180 / Math.PI) + 90}deg`);
                });
            }

            animate(timestamp) {
                if (!this.lastTimestamp) {
                    this.lastTimestamp = timestamp;
                }

                const delta = (timestamp - this.lastTimestamp) / 1000;
                this.lastTimestamp = timestamp;

                const width = window.innerWidth;
                const height = window.innerHeight;
                const minDimension = Math.min(width, height);

                this.bees.forEach((bee) => {
                    bee.angle += bee.speed * delta;
                    const radiusPx = bee.radius * minDimension;
                    const wobble = Math.sin(timestamp * 0.004 + bee.wobblePhase) * bee.wobbleAmplitude;
                    const x = bee.center.x * width + Math.cos(bee.angle) * radiusPx;
                    const y = bee.center.y * height + Math.sin(bee.angle) * radiusPx * bee.eccentricity + wobble;

                    bee.element.style.setProperty('--bee-x', `${x - 13}px`);
                    bee.element.style.setProperty('--bee-y', `${y - 9}px`);
                    bee.element.style.setProperty('--bee-rotation', `${(bee.angle * 180 / Math.PI) + 90}deg`);
                });

                this.animationId = requestAnimationFrame(this.animate);
            }
        }
        
        // Toast Notification System
        class ToastManager {
            constructor() {
                this.container = document.getElementById('toastContainer');
            }
            
            show(message, type = 'info', duration = 5000) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <div>${message}</div>
                    <button onclick="this.parentNode.remove()" style="float: right; background: none; border: none; cursor: pointer;">&times;</button>
                `;
                
                this.container.appendChild(toast);
                
                // Show animation
                setTimeout(() => toast.classList.add('show'), 100);
                
                // Auto-remove
                if (duration > 0) {
                    setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => toast.remove(), 300);
                    }, duration);
                }
                
                return toast;
            }
            
            success(message, duration = 5000) {
                return this.show(message, 'success', duration);
            }
            
            error(message, duration = 8000) {
                return this.show(message, 'error', duration);
            }
        }
        
        // Initialize systems when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            const bgDisabled =
                (window.__beesmartDisableBackgroundAnimations === true) ||

    <!-- Mobile Viewport Handler for iOS/Android -->
    <script>
        // Fix iOS Safari viewport height issue
        function setVhProperty() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        
        // Set initial viewport height
        setVhProperty();
        
        // Update on resize (orientation change, keyboard show/hide)
        window.addEventListener('resize', setVhProperty);
        window.addEventListener('orientationchange', () => {
            setTimeout(setVhProperty, 100);
        });
        
        // Enhanced scrolling for iOS
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            document.addEventListener('touchstart', function() {}, {passive: true});
            
            // Prevent zoom on double tap for form elements
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    // Avoid blocking normal taps/clicks on interactive controls.
                    // A global preventDefault() on touchend can suppress click/navigation on iOS.
                    const target = event && event.target;
                    const isInteractive = !!(target && target.closest && target.closest('a, button, input, textarea, select, label'));
                    if (!isInteractive && event.cancelable) {
                        event.preventDefault();
                    }
                }
                lastTouchEnd = now;
            }, false);
        }
        
        // Android keyboard handling
        if (/Android/.test(navigator.userAgent)) {
            const viewport = document.querySelector("meta[name=viewport]");
            viewport.setAttribute("content", viewport.content + ", viewport-fit=cover");
        }
        
        // Always scroll to top on page load
        window.addEventListener('load', function() {
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        });
        
        // Also scroll to top immediately (before full load)
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
    </script>
    
    <!-- 📱 Mobile Modal Auto-Centering System -->
    <script>
        /**
         * Mobile-optimized modal display system
         * Automatically centers modals and scrolls them into view on mobile devices
         */
        window.BeeMobileOptimization = {
            /**
             * Show a modal with mobile-optimized centering and scrolling
             * @param {HTMLElement|string} modal - Modal element or selector
             * @param {Object} options - Configuration options
             */
            showModal: function(modal, options = {}) {
                const modalEl = typeof modal === 'string' ? document.querySelector(modal) : modal;
                if (!modalEl) {
                    console.warn('BeeMobileOptimization: Modal not found', modal);
                    return;
                }
                
                const defaults = {
                    scrollIntoView: true,
                    scrollBehavior: 'smooth',
                    block: 'center',
                    lockScroll: true,
                    focusFirstInput: true
                };
                
                const config = { ...defaults, ...options };
                
                // Show the modal
                modalEl.style.display = 'flex';
                
                // Lock background scroll if requested
                if (config.lockScroll) {
                    document.body.style.overflow = 'hidden';
                    document.body.style.position = 'fixed';
                    document.body.style.width = '100%';
                }
                
                // Auto-scroll into view after a small delay (allows CSS animations)
                if (config.scrollIntoView) {
                    setTimeout(() => {
                        // Find the modal content (the actual dialog, not the overlay)
                        const modalContent = modalEl.querySelector('.modal-content, .exit-modal-content, .voice-intro-content, .badge-modal-content, .content-filter-popup');
                        const targetElement = modalContent || modalEl;
                        
                        // Scroll the modal content into view
                        targetElement.scrollIntoView({
                            behavior: config.scrollBehavior,
                            block: config.block,
                            inline: 'center'
                        });
                        
                        // Also ensure parent modal is visible
                        if (modalContent !== modalEl) {
                            modalEl.scrollIntoView({
                                behavior: config.scrollBehavior,
                                block: config.block,
                                inline: 'center'
                            });
                        }
                        
                        // Focus first input/button for accessibility
                        if (config.focusFirstInput) {
                            const firstInput = modalEl.querySelector('input:not([type="hidden"]), textarea, button');
                            if (firstInput) {
                                setTimeout(() => firstInput.focus(), 300);
                            }
                        }
                    }, 150); // Delay to allow modal animation to start
                }
                
                console.log('✅ Modal shown with mobile optimization:', modalEl.id || modalEl.className);
            },
            
            /**
             * Hide a modal and restore scroll
             * @param {HTMLElement|string} modal - Modal element or selector
             */
            hideModal: function(modal) {
                const modalEl = typeof modal === 'string' ? document.querySelector(modal) : modal;
                if (!modalEl) return;
                
                modalEl.style.display = 'none';
                
                // Restore background scroll
                document.body.style.overflow = '';
                document.body.style.position = '';
                document.body.style.width = '';
                
                console.log('✅ Modal hidden:', modalEl.id || modalEl.className);
            },
            
            /**
             * Auto-patch existing modal show/hide functions
             */
            patchExistingModals: function() {
                // Patch common modal show patterns
                const modalSelectors = [
                    '#contentFilterModal',
                    '#exitModal',
                    '#voiceIntroModal',
                    '.exit-modal',
                    '.voice-intro-modal'
                ];
                
                modalSelectors.forEach(selector => {
                    const modal = document.querySelector(selector);
                    if (modal) {
                        // Add data attribute to mark as mobile-optimized
                        modal.setAttribute('data-mobile-optimized', 'true');
                        
                        // Monitor style changes to auto-scroll when shown
                        const observer = new MutationObserver((mutations) => {
                            mutations.forEach((mutation) => {
                                if (mutation.attributeName === 'style') {
                                    const display = window.getComputedStyle(modal).display;
                                    if (display === 'flex' || display === 'block') {
                                        // Modal was just shown - auto-center it
                                        setTimeout(() => {
                                            const modalContent = modal.querySelector('.modal-content, .exit-modal-content, .voice-intro-content, .badge-modal-content, .content-filter-popup');
                                            const target = modalContent || modal;
                                            target.scrollIntoView({
                                                behavior: 'smooth',
                                                block: 'center',
                                                inline: 'center'
                                            });
                                        }, 100);
                                    }
                                }
                            });
                        });
                        
                        observer.observe(modal, { attributes: true, attributeFilter: ['style'] });
                    }
                });
            }
        };
        
        // Auto-patch modals when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.BeeMobileOptimization.patchExistingModals();
            });
        } else {
            window.BeeMobileOptimization.patchExistingModals();
        }
        
        // Re-patch on dynamic content changes
        setTimeout(() => {
            window.BeeMobileOptimization.patchExistingModals();
        }, 1000);
    </script>

    <!-- If running inside Capacitor, open external links in the native browser -->
    <script>
        (function(){
            function isExternalUrl(href){
                try {
                    const u = new URL(href, window.location.origin);
                    return u.origin !== window.location.origin;
                } catch(e){ return false; }
            }
            document.addEventListener('click', function(e){
                const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if(!a) return;
                const href = a.getAttribute('href');
                if(!href || href.startsWith('#')) return;
                const cap = window.Capacitor;
                const browser = cap && cap.Plugins && cap.Plugins.Browser;
                if (browser && isExternalUrl(href)) {
                    e.preventDefault();
                    try { browser.open({ url: href }); } catch(_) {}
                }
            }, true);

            // Handle deep links (universal/app links) when app is launched from a URL
            try {
                const App = window.Capacitor && (window.Capacitor.App || (window.Capacitor.Plugins && window.Capacitor.Plugins.App));
                if (App && App.addListener) {
                    App.addListener('appUrlOpen', (data) => {
                        if (data && data.url) {
                            // Navigate webview to the incoming URL so the web app routes correctly
                            try { window.location.href = data.url; } catch(_) {}
                        }
                    });
                }
            } catch(_) {}
        })();
    </script>
    <!-- SVG viewBox sanitizer: converts percentage viewBox values to numeric units to silence console errors -->
    <script>
    (function(){
        function sanitizeViewBoxes(){
            try {
                var svgs = document.querySelectorAll('svg[viewBox*="%"]');
                svgs.forEach(function(svg){
                    var raw = svg.getAttribute('viewBox');
                    if(!raw) return;
                    var parts = raw.trim().split(/\s+/);
                    if(parts.length !== 4) return;
                    var changed = false;
                    var cleaned = parts.map(function(p){
                        if(p.indexOf('%') !== -1){
                            var num = parseFloat(p.replace('%',''));
                            if(!isNaN(num)){
                                changed = true;
                                // Interpret percentage relative to 100 units (e.g., 90% -> 90)
                                return (num).toString();
                            }
                            return '0';
                        }
                        return p;
                    });
                    if(changed && cleaned.every(function(x){return /^-?\d+(\.\d+)?$/.test(x);})){
                        svg.setAttribute('viewBox', cleaned.join(' '));
                    }
                });
            } catch(e){ /* silent */ }
        }
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', sanitizeViewBoxes);
        } else {
            sanitizeViewBoxes();
        }
    })();
    </script>
