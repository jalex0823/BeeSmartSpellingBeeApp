<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Avatar Test - Superbee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        #avatar-canvas {
            width: 100%;
            height: 600px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: block;
            margin-bottom: 20px;
        }
        .log-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #4CAF50;
            padding-left: 10px;
        }
        .log-entry.error {
            border-left-color: #f44336;
            color: #ffcdd2;
        }
        .log-entry.warning {
            border-left-color: #ff9800;
            color: #ffe0b2;
        }
        .log-entry.success {
            border-left-color: #4CAF50;
            color: #c8e6c9;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐝 Single Avatar Test</h1>
        <p class="subtitle" id="avatar-name">Testing Superbee rendering with detailed diagnostics</p>

        <canvas id="avatar-canvas"></canvas>

        <div class="controls">
            <button onclick="previousAvatar()">⬅️ Previous Avatar</button>
            <button onclick="nextAvatar()">Next Avatar ➡️</button>
            <button onclick="loadAvatar()">🔄 Reload Avatar</button>
            <button onclick="rotateLeft()">↺ Rotate Left</button>
            <button onclick="rotateRight()">Rotate Right ↻</button>
            <button onclick="resetCamera()">📷 Reset Camera</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>

        <div class="controls">
            <strong>Debugging Tools:</strong><br>
            <button onclick="toggleWireframe()">🔲 Toggle Wireframe</button>
            <button onclick="toggleLighting()">💡 Toggle Lighting</button>
            <button onclick="dumpSceneInfo()">📊 Dump Scene Info</button>
            <button onclick="testTextureDirectly()">🖼️ Test Texture</button>
            <button onclick="toggleBackfaceCulling()">👁️ Toggle Backface Culling</button>
            <button onclick="forceShowMagenta()">🎨 Force Magenta (Test Visibility)</button>
            <button onclick="restoreMaterials()">♻️ Restore Materials</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Load Status</div>
                <div class="stat-value" id="load-status">⏳</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Load Time</div>
                <div class="stat-value" id="load-time">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Vertices</div>
                <div class="stat-value" id="vertex-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Triangles</div>
                <div class="stat-value" id="triangle-count">-</div>
            </div>
        </div>

        <div class="log-section" id="log-container">
            <div class="log-entry success">📋 Console initialized. Waiting for avatar load...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>

    <script>
        // Avatar database - all avatars with their ACTUAL file names
        const AVATARS = [
            { name: 'Doctor Bee', slug: 'beedoctor', obj: 'DoctorBee.obj', mtl: 'BeeDoctor.mtl', texture: 'DoctorBee.png' },
            { name: 'Knight Bee', slug: 'beeknight', obj: 'KnightBee.obj', mtl: 'BeeKnight.mtl', texture: 'KnightBee.png' },
            { name: 'Builder Bee', slug: 'builderbee', obj: 'BuilderBee.obj', mtl: 'BuilderBee.mtl', texture: 'BuilderBee.png' },
            { name: 'Buzzbot Bee', slug: 'buzzbotbee', obj: 'BuzzbotBee.obj', mtl: 'BuzzbotBee.mtl', texture: 'BuzzbotBee.png' },
            { name: 'Buzzhero Bee', slug: 'buzzhero', obj: 'BuzzheroBee.obj', mtl: 'BuzzHero.mtl', texture: 'BuzzheroBee.png' },
            { name: 'Detective Bee', slug: 'detectivebee', obj: 'DetectiveBee.obj', mtl: 'DetectiveBee.mtl', texture: 'DetectiveBee.png' },
            { name: 'Explorer Bee', slug: 'explorerbee', obj: 'ExplorerBee.obj', mtl: 'ExplorerBee.mtl', texture: 'ExplorerBee.png' },
            { name: 'Franken Bee', slug: 'frankenbee', obj: 'FrankenBee.obj', mtl: 'Frankenbee.mtl', texture: 'FrankenBee.png' },
            { name: 'Motorcyclebuzz Bee', slug: 'motorcyclebuzzbee', obj: 'MotorcyclebuzzBee.obj', mtl: 'MotorcycleBuzzBee.mtl', texture: 'MotorcyclebuzzBee.png' },
            { name: 'Queen Bee Majesty', slug: 'queenbeemajesty', obj: 'QueenmajestyBee.obj', mtl: 'QueenBeeMajesty.mtl', texture: 'QueenmajestyBee.png' },
            { name: 'Sea Bee', slug: 'seabee', obj: 'SeaBee.obj', mtl: 'SeaBee.mtl', texture: 'SeaBee.png' },
            { name: 'Space Explorer Bee', slug: 'spacebeeexplorer', obj: 'SpaceexplorerBee.obj', mtl: 'SpaceBeeExplorer.mtl', texture: 'SpaceexplorerBee.png' },
            { name: 'Superhero Bee', slug: 'superbeehero', obj: 'SuperheroBee.obj', mtl: 'SuperBeeHero.mtl', texture: 'SuperheroBee.png' }
        ];
        
        // Start with Doctor Bee (index 0) for testing
        let currentAvatarIndex = 0;
        
        function previousAvatar() {
            currentAvatarIndex = (currentAvatarIndex - 1 + AVATARS.length) % AVATARS.length;
            loadAvatar();
        }
        
        function nextAvatar() {
            currentAvatarIndex = (currentAvatarIndex + 1) % AVATARS.length;
            loadAvatar();
        }
        
        // Logging system
        function log(message, type = 'success') {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLogs() {
            document.getElementById('log-container').innerHTML = '';
            log('Logs cleared', 'success');
        }

        // Three.js setup
        let scene, camera, renderer, avatarObject;
        let loadStartTime;

        function initThreeJS() {
            log('Initializing Three.js scene...', 'success');
            
            const canvas = document.getElementById('avatar-canvas');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            log('✓ Scene created', 'success');

            // Camera
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 2, 8);
            camera.lookAt(0, 0, 0);
            log('✓ Camera positioned at (0, 2, 8)', 'success');

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            log(`✓ Renderer initialized (${width}x${height})`, 'success');

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-5, 0, -5);
            scene.add(fillLight);
            log('✓ Lights added (ambient + 2 directional)', 'success');

            // Axes helper
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);
            log('✓ Axes helper added', 'success');

            // Grid
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);
            log('✓ Grid helper added', 'success');

            // Start animation loop
            animate();
            log('✓ Animation loop started', 'success');
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Auto-rotate avatar if loaded
            if (avatarObject) {
                avatarObject.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }

        function loadOBJDirectly(avatarPath, objFile, materials) {
            // Load OBJ without MTL, optionally with pre-loaded materials
            const objLoader = new THREE.OBJLoader();
            objLoader.setPath(avatarPath + '/');
            if (materials) {
                objLoader.setMaterials(materials);
            }
            
            log(`Loading OBJ: ${avatarPath}/${objFile}`, 'success');
            
            objLoader.load(
                objFile,
                function(object) {
                    const loadTime = ((Date.now() - loadStartTime) / 1000).toFixed(2);
                    log(`✓ OBJ loaded successfully in ${loadTime}s`, 'success');
                    
                    // Calculate stats
                    let vertices = 0;
                    let triangles = 0;
                    object.traverse((child) => {
                        if (child.isMesh) {
                            vertices += child.geometry.attributes.position.count;
                            triangles += child.geometry.index ? child.geometry.index.count / 3 : child.geometry.attributes.position.count / 3;
                            log(`  Mesh found: ${child.name || 'unnamed'}`, 'success');
                            log(`    Vertices: ${child.geometry.attributes.position.count.toLocaleString()}`, 'success');
                            log(`    Material: ${child.material.name || 'default'}`, 'success');
                            
                            // Check texture
                            if (child.material.map) {
                                log(`    ✓ Texture applied: ${child.material.map.image?.src || 'unknown'}`, 'success');
                            } else {
                                log(`    ⚠ No texture found on material`, 'warning');
                            }
                        }
                    });

                    document.getElementById('vertex-count').textContent = vertices.toLocaleString();
                    document.getElementById('triangle-count').textContent = Math.floor(triangles).toLocaleString();
                    document.getElementById('load-time').textContent = `${loadTime}s`;
                    document.getElementById('load-status').textContent = '✅';

                    // Center and scale
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    object.position.x = -center.x;
                    object.position.y = -center.y;
                    object.position.z = -center.z;
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 3 / maxDim;
                    object.scale.setScalar(scale);
                    
                    log(`  Bounding box: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`, 'success');
                    log(`  Scale factor: ${scale.toFixed(3)}`, 'success');

                    avatarObject = object;
                    scene.add(avatarObject);
                    log('✓ Avatar added to scene and visible!', 'success');
                    log('========================================', 'success');
                },
                function(xhr) {
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
                    log(`Loading OBJ: ${percent}% (${(xhr.loaded / 1024 / 1024).toFixed(2)} MB)`, 'success');
                },
                function(error) {
                    // Error could be ProgressEvent, string, or object
                    let errorMsg = error?.message || error?.type || JSON.stringify(error) || 'Unknown error';
                    console.error('OBJ Load Error Details:', {
                        error: error,
                        message: error?.message,
                        type: error?.type,
                        status: error?.status,
                        statusText: error?.statusText,
                        errorMsg: errorMsg,
                        url: `${avatarPath}/${objFile}`
                    });
                    
                    log(`❌ OBJ load error: ${errorMsg}`, 'error');
                    log(`   URL attempted: ${avatarPath}/${objFile}`, 'error');
                    document.getElementById('load-status').textContent = '❌ OBJ Error';
                }
            );
        }

        function loadAvatar() {
            log('========================================', 'success');
            const avatar = AVATARS[currentAvatarIndex];
            log(`Starting avatar load sequence: ${avatar.name} (${currentAvatarIndex + 1}/${AVATARS.length})`, 'success');
            
            // Update title
            document.getElementById('avatar-name').textContent = `Testing ${avatar.name} (${currentAvatarIndex + 1}/${AVATARS.length})`;
            document.title = `Single Avatar Test - ${avatar.name}`;
            
            loadStartTime = Date.now();
            document.getElementById('load-status').textContent = '⏳';
            document.getElementById('load-time').textContent = '-';

            // Remove existing avatar
            if (avatarObject) {
                scene.remove(avatarObject);
                log('Removed previous avatar from scene', 'warning');
            }

            const avatarPath = `/static/assets/avatars/${avatar.slug}`;
            const objFile = avatar.obj;
            const mtlFile = avatar.mtl;
            const texturFile = avatar.texture;

            log(`Avatar path: ${avatarPath}`, 'success');
            log(`OBJ file: ${objFile}`, 'success');
            log(`MTL file: ${mtlFile}`, 'success');
            log(`Texture file: ${texturFile}`, 'success');

            // MTL Loader with timeout
            const mtlLoader = new THREE.MTLLoader();
            mtlLoader.setPath(avatarPath + '/');
            
            log(`Loading MTL: ${avatarPath}/${mtlFile}`, 'success');
            
            // Set a timeout for MTL loading - if it takes more than 5 seconds, fallback
            let mtlTimeoutId = setTimeout(() => {
                log(`⚠️ MTL loading timed out after 5s, loading OBJ without materials`, 'warning');
                loadOBJDirectly(avatarPath, objFile, null);
            }, 5000);
            
            mtlLoader.load(
                mtlFile,
                function(materials) {
                    clearTimeout(mtlTimeoutId);
                    log('✓ MTL loaded successfully', 'success');
                    log(`  Materials found: ${Object.keys(materials.materials).length} total`, 'success');
                    Object.keys(materials.materials).forEach(name => {
                        const mat = materials.materials[name];
                        log(`    - ${name}: map=${!!mat.map}, color=${mat.color ? mat.color.getHexString() : 'none'}`, 'success');
                    });
                    materials.preload();
                    log('✓ Materials preloaded', 'success');

                    // Load OBJ with materials
                    loadOBJDirectly(avatarPath, objFile, materials);
                },
                function(xhr) {
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
                    log(`Loading MTL: ${percent}%`, 'success');
                },
                function(error) {
                    let errorMsg = error?.message || error?.type || JSON.stringify(error) || 'Unknown error';
                    console.error('MTL Load Error Details:', {
                        error: error,
                        message: error?.message,
                        type: error?.type,
                        status: error?.status,
                        statusText: error?.statusText,
                        errorMsg: errorMsg,
                        url: `${avatarPath}/${mtlFile}`
                    });
                    
                    log(`❌ MTL load error: ${errorMsg}`, 'error');
                    log(`   URL attempted: ${avatarPath}/${mtlFile}`, 'error');
                    document.getElementById('load-status').textContent = '❌ MTL Error';
                    // Fallback: try loading OBJ without MTL
                    log('Falling back to OBJ without MTL...', 'warning');
                    loadOBJDirectly(avatarPath, objFile, null);
                }
            );
        }

        function rotateLeft() {
            if (avatarObject) {
                avatarObject.rotation.y -= 0.5;
                log('Rotated left 30°', 'success');
            }
        }

        function rotateRight() {
            if (avatarObject) {
                avatarObject.rotation.y += 0.5;
                log('Rotated right 30°', 'success');
            }
        }

        function resetCamera() {
            camera.position.set(0, 2, 8);
            camera.lookAt(0, 0, 0);
            log('Camera reset to default position', 'success');
        }

        // ============ DEBUGGING FUNCTIONS ============
        
        function toggleWireframe() {
            try {
                if (!avatarObject) {
                    log('No avatar loaded yet', 'warning');
                    return;
                }
                
                let wireframeCount = 0;
                avatarObject.traverse((child) => {
                    if (child.isMesh) {
                        child.material.wireframe = !child.material.wireframe;
                        wireframeCount++;
                        log(`  Toggled ${child.name || 'mesh'} wireframe: ${child.material.wireframe}`, 'success');
                    }
                });
                
                log(`✓ Wireframe toggled on ${wireframeCount} meshes`, 'success');
            } catch (err) {
                log(`❌ Wireframe error: ${err.message}`, 'error');
                console.error(err);
            }
        }

        function toggleLighting() {
            try {
                const lights = scene.children.filter(c => c.isLight);
                if (lights.length === 0) {
                    log('No lights found in scene', 'warning');
                    return;
                }
                
                lights.forEach(light => {
                    light.visible = !light.visible;
                });
                
                const state = lights[0]?.visible ? 'ON' : 'OFF';
                log(`✓ Lighting: ${state} (${lights.length} lights)`, 'success');
            } catch (err) {
                log(`❌ Lighting error: ${err.message}`, 'error');
                console.error(err);
            }
        }

        function dumpSceneInfo() {
            try {
                log('=== SCENE DEBUG INFO ===', 'success');
                
                if (!avatarObject) {
                    log('⚠️ No avatar loaded yet', 'warning');
                    log('=== END DEBUG INFO ===', 'success');
                    return;
                }
                
                log(`Avatar: ${avatarObject.name || 'unnamed'}`, 'success');
                log(`Position: (${avatarObject.position.x.toFixed(2)}, ${avatarObject.position.y.toFixed(2)}, ${avatarObject.position.z.toFixed(2)})`, 'success');
                log(`Scale: (${avatarObject.scale.x.toFixed(2)}, ${avatarObject.scale.y.toFixed(2)}, ${avatarObject.scale.z.toFixed(2)})`, 'success');
                
                let meshCount = 0;
                let totalVertices = 0;
                
                avatarObject.traverse((child) => {
                    if (child.isMesh) {
                        meshCount++;
                        totalVertices += child.geometry.attributes.position.count;
                        const hasTexture = !!child.material.map;
                        const hasColor = child.material.color?.getHexString?.();
                        
                        log(`Mesh ${meshCount}: ${child.name || 'unnamed'}`, 'success');
                        log(`  Vertices: ${child.geometry.attributes.position.count}`, 'success');
                        log(`  Material: ${child.material.name || 'default'}`, 'success');
                        log(`  Has texture: ${hasTexture}`, hasTexture ? 'success' : 'warning');
                        log(`  Color: ${hasColor || 'default'}`, 'success');
                        log(`  Wireframe: ${child.material.wireframe}`, 'success');
                    }
                });
                
                log(`Total: ${meshCount} meshes, ${totalVertices} vertices`, 'success');
                log(`Camera Z: ${camera.position.z.toFixed(2)}`, 'success');
                log('=== END DEBUG INFO ===', 'success');
            } catch (err) {
                log(`❌ Debug error: ${err.message}`, 'error');
                console.error(err);
            }
        }

        function testTextureDirectly() {
            try {
                if (!avatarObject) {
                    log('No avatar loaded yet', 'warning');
                    return;
                }
                
                log('Testing textures...', 'success');
                let textureCount = 0;
                
                avatarObject.traverse((child) => {
                    if (child.isMesh) {
                        if (child.material.map) {
                            textureCount++;
                            const texture = child.material.map;
                            log(`✓ Texture on ${child.name}: ${texture.image?.currentSrc || 'src unknown'}`, 'success');
                        } else {
                            log(`✗ No texture on ${child.name}`, 'warning');
                        }
                    }
                });
                
                log(`Found ${textureCount} textured meshes`, textureCount > 0 ? 'success' : 'warning');
            } catch (err) {
                log(`❌ Texture test error: ${err.message}`, 'error');
                console.error(err);
            }
        }

        function forceShowMagenta() {
            if (!avatarObject) {
                log('No avatar loaded yet', 'warning');
                return;
            }
            
            log('Forcing magenta material to see if model is visible...', 'success');
            let meshCount = 0;
            
            avatarObject.traverse((child) => {
                if (child.isMesh) {
                    meshCount++;
                    // Create a bright magenta material
                    child.material = new THREE.MeshPhongMaterial({
                        color: 0xff00ff,
                        emissive: 0xff00ff,
                        shininess: 100
                    });
                    log(`  Applied magenta to ${child.name || 'mesh'}`, 'success');
                }
            });
            
            log(`Magenta applied to ${meshCount} meshes - if you see magenta, model is there!`, 'success');
        }

        function restoreMaterials() {
            if (!avatarObject) {
                log('No avatar loaded yet', 'warning');
                return;
            }
            
            log('Reloading avatar to restore materials...', 'success');
            loadAvatar();
        }

        function toggleBackfaceCulling() {
            if (!avatarObject) {
                log('No avatar loaded yet', 'warning');
                return;
            }
            
            let cullingSwitched = false;
            avatarObject.traverse((child) => {
                if (child.isMesh) {
                    const currentSide = child.material.side;
                    // Cycle: FrontSide -> BackSide -> DoubleSide -> FrontSide
                    if (currentSide === THREE.FrontSide) {
                        child.material.side = THREE.BackSide;
                        cullingSwitched = true;
                    } else if (currentSide === THREE.BackSide) {
                        child.material.side = THREE.DoubleSide;
                    } else {
                        child.material.side = THREE.FrontSide;
                    }
                    child.material.needsUpdate = true;
                }
            });
            
            const sides = {[THREE.FrontSide]: 'Front', [THREE.BackSide]: 'Back', [THREE.DoubleSide]: 'Double'};
            const newSide = sides[avatarObject.children[0]?.material?.side] || 'Unknown';
            log(`Backface culling: ${newSide} side visible`, 'success');
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('avatar-canvas');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            log(`Window resized: ${width}x${height}`, 'success');
        });

        // Initialize on page load
        window.addEventListener('load', () => {
            log('Page loaded, initializing...', 'success');
            initThreeJS();
            setTimeout(() => {
                loadAvatar();
            }, 500);
        });
    </script>
</body>
</html>
