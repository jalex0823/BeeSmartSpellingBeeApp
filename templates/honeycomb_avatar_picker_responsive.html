<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Bee Avatar - BeeSmart</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='favicon-96x96.png') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/honeycomb-avatar-picker-responsive.css') }}?v={{ timestamp }}">
    
    <!-- Three.js and Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    
    <!-- Avatar Theme System (must load before picker) -->
    <script src="{{ url_for('static', filename='js/avatar-theme-system.js') }}?v={{ timestamp }}"></script>
</head>
<body class="honeycomb-avatar-picker" {% if picker_bg_url %}style="--picker-bg-image: url('{{ picker_bg_url }}')"{% endif %}>
    
    <!-- Loading Overlay with Real-time Progress -->
    <div id="avatar-loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <!-- Replace bee emoji with Trademarked brand logo -->
            <img 
                class="loading-logo"
                src="{{ url_for('static', filename='images/LogoBee&WordingTM.png') }}?v={{ timestamp }}"
                alt="BeeSmart Spelling App™ logo"
                style="
                    width: clamp(240px, 55vw, 560px);
                    height: auto;
                    margin-bottom: 16px;
                    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.35));
                    image-rendering: -webkit-optimize-contrast;
                "
            />
            <h2 id="loading-status">Loading Your Bees...</h2>
            <div class="loading-bar">
                <div id="loading-progress" class="loading-progress"></div>
            </div>
            <p id="loading-text" class="loading-text">0%</p>
            <p id="loading-detail" style="color: rgba(255, 215, 0, 0.7); font-size: 0.9rem; margin-top: 0.5rem;">Initializing...</p>
        </div>
    </div>
    
    <!-- Header (title first, centered buttons below) -->
    <div class="picker-header" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding-top:8px;">
        <h1 style="margin:0; text-align:center; min-width:240px;">🐝 Choose Your Bee Avatar 🍯</h1>
        <div class="picker-nav" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <a href="/" class="btn-back" style="text-decoration:none; padding:8px 12px; border-radius:8px; background:linear-gradient(135deg, #3b3b3b, #1f1f1f); color:#ffd700; border:1px solid rgba(255,215,0,0.3); box-shadow:0 2px 6px rgba(0,0,0,0.3); font-weight:600;">
                ⬅ Back to Home
            </a>
            <a href="/admin/dashboard" class="btn-admin" style="text-decoration:none; padding:8px 12px; border-radius:8px; background:linear-gradient(135deg, #3b3b3b, #1f1f1f); color:#ffd700; border:1px solid rgba(255,215,0,0.3); box-shadow:0 2px 6px rgba(0,0,0,0.3); font-weight:600;">
                🧭 Admin Portal
            </a>
        </div>
    </div>

    <!-- Auth Banner: gentle guidance for guests to log in to customize -->
    <style>
        /* Responsive, compact banner adjustments */
        @media (max-width: 480px) {
            #auth-banner { padding: 8px 12px !important; gap: 6px !important; font-size: 0.95rem !important; }
            #auth-banner a { padding: 6px 10px !important; font-size: 0.9rem !important; }
            #auth-banner button.auth-banner-close { top: 6px !important; right: 6px !important; width: 28px !important; height: 28px !important; font-size: 1rem !important; }
        }
        /* Marquee animation for unlock status */
        .marquee-content {
            animation: marquee 20s linear infinite;
        }
        .marquee-content:hover {
            animation-play-state: paused;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
    <div id="auth-banner" role="alert" aria-live="polite" style="
        margin: 10px auto 16px auto;
        max-width: 980px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 2px dashed rgba(255, 215, 0, 0.6);
        background: linear-gradient(135deg, rgba(255, 249, 227, 0.95) 0%, rgba(255, 244, 199, 0.9) 100%);
        color: #5a4000;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 700;
        text-align: center;
        box-shadow: 0 8px 24px rgba(255, 215, 0, 0.18);
        position: relative;
    ">
        <button type="button" class="auth-banner-close" aria-label="Dismiss" title="Dismiss" onclick="(function(){const b=document.getElementById('auth-banner'); if(b) b.remove();})();" style="
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.7);
            background: rgba(255, 255, 255, 0.7);
            color: #5a4000;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        ">×</button>
        {% if not current_user.is_authenticated %}
            <span class="auth-banner-text">🔐 Please log in to customize your avatar.</span>
            <a href="/auth/login?next={{ request.path }}" style="
                text-decoration: none;
                padding: 6px 12px;
                border-radius: 10px;
                border: 2px solid rgba(255, 215, 0, 0.9);
                background: linear-gradient(135deg, #ffd54f, #ffb300);
                color: #3b2a00;
                box-shadow: 0 2px 6px rgba(0,0,0,0.15);
                white-space: nowrap;
            ">Log In</a>
        {% else %}
            <div class="marquee-container" style="flex: 1; overflow: hidden;">
                <div id="dynamic-marquee" class="marquee-content" style="display: inline-block; white-space: nowrap;">
                    <!-- Will be populated by JavaScript with unlock status -->
                    <span class="banner-message" style="display: inline-block; padding: 0 3rem;">🍯 Loading your hive status...</span>
                </div>
            </div>
        {% endif %}
    </div>
    
    <!-- Search Bar -->
    <div class="honeycomb-search-container">
        <input 
            type="text" 
            class="honeycomb-search" 
            placeholder="🔍 Search for your bee..."
            aria-label="Search avatars"
        >
    </div>
    
    <!-- Main Content: Grid + Preview -->
    <div class="honeycomb-content">
        
        <!-- Avatar Grid (Responsive CSS Grid) -->
        <div class="honeycomb-grid-container">
            <div class="honeycomb-grid">
                <!-- Avatars will be loaded here by JavaScript -->
            </div>
        </div>
        
        <!-- Preview Panel -->
        <div class="avatar-preview-panel">
            <div class="preview-content">
                <div class="preview-avatar-container">
                    <!-- Large preview will render here -->
                </div>
                <h2 class="preview-name">Select a Bee</h2>
                <p class="preview-description">Click on any bee to preview and select</p>
                <button 
                    class="preview-choose-btn" 
                    onclick="chooseAvatar()"
                    style="display: none;"
                >
                    Choose This Bee
                </button>
            </div>
        </div>
        
    </div>
    
    <script src="{{ url_for('static', filename='js/honeycomb-avatar-picker-responsive.js') }}?v={{ timestamp }}"></script>
</body>
</html>
