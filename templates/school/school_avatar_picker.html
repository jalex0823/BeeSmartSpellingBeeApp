<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Avatar - BeeSmart School</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/BeeKeeperBadge.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/BeeKeeperBadge.png') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f0e6; }
        .header {
            background: linear-gradient(135deg, {{ school_theme_primary or '#E6A800' }}, {{ school_theme_secondary or '#8B6914' }});
            color: #3b2b04;
            padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header a { color: #3b2b04; font-weight: 600; text-decoration: none; }
        .main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
        @media (min-width: 1024px) { .main { max-width: 1100px; } }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            border: 2px solid #e0d5b8;
            transition: border-color .2s, box-shadow .2s;
        }
        .card:hover { border-color: #E6A800; box-shadow: 0 4px 12px rgba(230,168,0,0.2); }
        .card.selected { border-color: #E6A800; background: #FFFBF0; }
        .card img { width: 80px; height: 80px; object-fit: contain; border-radius: 8px; }
        .card .name { font-weight: 600; margin-top: 0.5rem; font-size: 0.9rem; color: #3b2b04; }
        .msg { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .msg.success { background: #E8F5E9; color: #2E7D32; }
        .msg.error { background: #FFEBEE; color: #C62828; }
        .btn { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.25rem; background: #E6A800; color: #3b2b04; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <header class="header">
        <a href="{{ url_for('school_student_dashboard') }}">← Back</a>
        <h1 style="margin:0;font-size:1.25rem;">Choose your avatar</h1>
        <span></span>
    </header>
    <main class="main">
        <div id="msg" class="msg"></div>
        <p>Select an avatar for your school profile. Only avatars approved for your school are shown.</p>
        <div id="grid" class="grid"></div>
        <p><a href="{{ url_for('school_student_dashboard') }}" class="btn">Done</a></p>
    </main>
    <script>
        (function() {
            var grid = document.getElementById('grid');
            var msg = document.getElementById('msg');
            function showMsg(text, type) {
                msg.textContent = text;
                msg.className = 'msg ' + (type || '');
                msg.style.display = 'block';
            }
            fetch('{{ url_for("api_school_avatars") }}')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.status !== 'success' || !data.avatars || !data.avatars.length) {
                        grid.innerHTML = '<p>No avatars available for your school yet. Check back later.</p>';
                        return;
                    }
                    data.avatars.forEach(function(a) {
                        var card = document.createElement('div');
                        card.className = 'card';
                        card.dataset.slug = a.slug || a.id;
                        var thumb = (a.thumbnail_file || a.obj_file) ? ('/static/assets/avatars/glb_files/AvatarThumbnails/' + (a.obj_file || '').replace(/\.[^.]*$/, '') + '!.png') : '';
                        if (!thumb && a.folder) thumb = '/static/assets/avatars/' + (a.folder || '') + '/AvatarThumbnails/' + (a.obj_file || '').replace(/\.[^.]*$/, '') + '!.png';
                        card.innerHTML = '<img src="' + (thumb || '/static/images/BeeSmartSpellingBeeApplication.png') + '" alt="" onerror="this.src=\'/static/images/BeeSmartSpellingBeeApplication.png\'"><div class="name">' + (a.name || a.slug || a.id) + '</div>';
                        card.addEventListener('click', function() {
                            document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('selected'); });
                            card.classList.add('selected');
                            fetch('{{ url_for("school_avatar_select") }}', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                                body: JSON.stringify({ avatar_slug: card.dataset.slug })
                            })
                            .then(function(r) { return r.json(); })
                            .then(function(res) {
                                if (res.success) showMsg('Avatar updated!', 'success');
                                else showMsg(res.error || 'Update failed', 'error');
                            })
                            .catch(function() { showMsg('Request failed', 'error'); });
                        });
                        grid.appendChild(card);
                    });
                })
                .catch(function() { grid.innerHTML = '<p>Could not load avatars.</p>'; });
        })();
    </script>
</body>
</html>
