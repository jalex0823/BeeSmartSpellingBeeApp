<!-- Avatar Picker Component -->
<!-- Include this in registration.html and settings/profile page -->

<div class="avatar-picker-container">
    <h3>🐝 Choose Your Bee from the Hive 🍯</h3>
    <p class="avatar-subtitle">Which bee character will you be today?</p>
    
    <!-- Category Filters -->
    <div class="avatar-categories">
        <button class="category-btn active" data-category="all">🏠 All Bees</button>
        <button class="category-btn" data-category="classic">👑 Classic</button>
        <button class="category-btn" data-category="adventure">🗺️ Adventure</button>
        <button class="category-btn" data-category="profession">💼 Profession</button>
        <button class="category-btn" data-category="sports">⚽ Sports</button>
        <button class="category-btn" data-category="arts">🎨 Arts</button>
        <button class="category-btn" data-category="entertainment">🎭 Entertainment</button>
        <button class="category-btn" data-category="fantasy">✨ Fantasy</button>
    </div>
    
    <!-- Search Bar -->
    <div class="avatar-search">
        <input type="text" id="avatarSearch" placeholder="🔍 Search for your bee..." autocomplete="off">
        <span class="search-icon">�</span>
    </div>
    
    <!-- Avatar Grid (registration-style thumbnails) -->
    <div class="avatar-grid" id="avatarGrid">
        <!-- Will be populated via JavaScript -->
    </div>
    
    <!-- Selected Avatar Preview -->
    <div class="avatar-preview-panel">
        <h4>Preview</h4>
        <div class="avatar-preview-3d" id="avatarPreview">
            <div class="placeholder-avatar">
                <p>Select an avatar to preview</p>
                <span class="bee-icon">🐝</span>
            </div>
            <!-- 3D Viewer will be inserted here -->
        </div>
        
        <!-- Avatar Info -->
        <div class="avatar-info" id="avatarInfo" style="display: none;">
            <h5 id="avatarName"></h5>
            <p id="avatarDescription"></p>
            <p style="font-size: 0.75rem; color: #999; margin-top: 0.5rem; font-style: italic;">
                💡 Drag to rotate • Scroll to zoom
            </p>
        </div>
        
        <!-- Action Buttons -->
        <div class="avatar-actions">
            <button class="btn-back-menu" id="backToMenuBtn" onclick="window.location.href='/'">
                ← Back to Main Menu
            </button>
            <button class="btn-select-avatar" id="selectAvatarBtn" disabled>
                Use This Avatar
            </button>
        </div>
    </div>
    
    <!-- Avatar Loading Overlay (for smooth transitions) -->
    <div class="avatar-loading-overlay" id="avatarLoadingOverlay" style="display: none;">
        <div class="avatar-loading-content">
            <img src="/static/BeeSmartBee.png" 
                 alt="Loading" 
                 class="loading-bee-icon"
                 style="width: 100px; height: 100px; margin-bottom: 15px; animation: spin 2s linear infinite;">
            <div class="honey-pot-loader">
                <div class="honey-pot-fill" id="avatarLoadProgress"></div>
            </div>
            <p class="loading-text" id="avatarLoadingText">🐝 Preparing your new bee...</p>
            <p class="loading-subtext">Loading 3D model and textures</p>
        </div>
    </div>
</div>
