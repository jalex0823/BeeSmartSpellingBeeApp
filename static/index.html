<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeeSmart Spelling</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #fff7cc; }
      .wrap { height: 100%; display: grid; place-items: center; }
      .card { text-align: center; padding: 20px 18px; border-radius: 14px; background: rgba(255,255,255,0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
      .title { font-size: 18px; font-weight: 800; color: #2b1a00; }
      .sub { font-size: 13px; color: #5a3a00; margin-top: 6px; }
      .spinner { width: 22px; height: 22px; border-radius: 999px; border: 3px solid rgba(255, 170, 0, 0.35); border-top-color: rgba(255, 170, 0, 0.95); margin: 14px auto 0; animation: spin 900ms linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="title">Loading BeeSmart…</div>
        <div class="sub">Getting your spelling hive ready.</div>
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // Capacitor offline entry: redirect into the Flask route.
      // (Capacitor serves this file as the web entry point.)
      window.location.replace('/');
    </script>
  </body>
</html>
