name: beesmart-spelling-bee
region: nyc
services:
  - name: web
    github:
      repo: jalex0823/BeeSmartSpellingBeeApp
      branch: main
      deploy_on_push: true
    
    # Build configuration (trigger: 2025-12-11)
    build_command: pip install --upgrade pip && pip install -r requirements.txt
    
    # Run configuration - Using eventlet worker for Socket.IO compatibility
    run_command: gunicorn --bind 0.0.0.0:${PORT:-8080} --timeout 600 --graceful-timeout 30 --workers 1 --worker-class eventlet --keep-alive 5 --log-level info --access-logfile - --error-logfile - AjaSpellBApp:app
    
    # Health check
    health_check:
      http_path: /health
      initial_delay_seconds: 120
      period_seconds: 30
      timeout_seconds: 30
      success_threshold: 1
      failure_threshold: 5
    
    # Environment variables
    envs:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        type: SECRET
      
      - key: FLASK_APP
        value: AjaSpellBApp.py
      
      - key: FLASK_ENV
        value: production
      
      - key: SECRET_KEY
        value: ${SECRET_KEY}
        type: SECRET
      
      - key: BEESMART_ADMIN_KEY
        value: ${BEESMART_ADMIN_KEY}
        type: SECRET
      
      - key: PORT
        value: "8080"
      
      - key: FAST_BOOT
        value: "1"
      
      - key: PYTHONUNBUFFERED
        value: "1"
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xxs
    
    # HTTP configuration
    http_port: 8080
    
    # Source directory
    source_dir: /
