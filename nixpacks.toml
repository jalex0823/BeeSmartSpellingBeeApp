[phases.setup]
nixPkgs = ["python311", "postgresql", "tesseract"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]
cacheDirectories = ["/root/.cache/pip"]

[env]
PIP_NO_INPUT = "1"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_CACHE_DIR = "/root/.cache/pip"

[start]
cmd = "gunicorn --bind 0.0.0.0:${PORT:-5000} --timeout 600 --graceful-timeout 30 --workers 1 --worker-class sync --keep-alive 5 --log-level info --access-logfile - --error-logfile - AjaSpellBApp:app"
