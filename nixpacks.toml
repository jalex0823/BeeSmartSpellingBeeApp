[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[start]
cmd = "gunicorn --bind 0.0.0.0:${PORT:-5000} --timeout 600 --graceful-timeout 30 --workers 1 --threads 4 --worker-class gthread --keep-alive 5 --log-level info --access-logfile - --error-logfile - AjaSpellBApp:app"
